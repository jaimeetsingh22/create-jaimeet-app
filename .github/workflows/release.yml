name: Release & Publish CLI

on:
  push:
    branches:
      - main

# It's important to set permissions for release-please to be able to create PRs and releases
permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Create Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Run release-please to create PR, bump version & changelog
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          release-type: node

  publish:
    name: Publish to npm
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      # Checkout latest code (after merge)
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/

      # Install dependencies cleanly
      - name: Install dependencies
        run: npm ci

      # Publish package to npm
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}